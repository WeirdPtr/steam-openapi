[package]
name = "better-steam-web-api"
version = "0.0.1"
description = "Steam Web Api Helper"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["WeirdPtr <WeirdPtr@WeirdPtr.com>"]
repository = "https://github.com/WeirdPtr/better-steam-web-api"
keywords = ["steam", "api"]
include = ["src/**/*", "LICENSE-MIT.md", "LICENSE-APACHE.md", "README.md"]
publish = false

[dependencies]
env_logger = "0.11.11"
log = "0.4.34"
reqwest = { version = "0.13.4", features = ["blocking", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
utoipa = "5.5.0"
